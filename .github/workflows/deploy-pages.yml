name: Deploy personal homepage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site/images _site/videos
          cp index.html site.css He-Zhang-CV.pdf og.png robots.txt sitemap.xml \
            google6e675bddd4b9fd2b.html googlea21da0bfe4bafabf.html \
            favicon.ico favicon-48x48.png favicon-192x192.png favicon-512x512.png \
            apple-touch-icon.png site.webmanifest _site/
          cp -R images/. _site/images/
          cp -R videos/. _site/videos/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
